<nav class="navbar navbar-expand-lg app-navbar" aria-label="Main navigation">
  <div class="container-fluid app-navbar__container">
    <a class="navbar-brand app-navbar__brand" routerLink="/category" (click)="closeMenu()">
      <span class="app-navbar__brand-mark" aria-hidden="true">E</span>
      <span>Enquiry Desk</span>
    </a>

    <button
      class="navbar-toggler app-navbar__toggler"
      [class.is-open]="menuOpen"
      type="button"
      aria-label="Toggle navigation menu"
      aria-controls="primary-navigation"
      [attr.aria-expanded]="menuOpen"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div
      id="primary-navigation"
      class="navbar-collapse app-navbar__collapse"
      [class.show]="menuOpen"
    >
      <div class="navbar-nav app-navbar__links">
        <a
          class="nav-link app-navbar__link"
          routerLink="/create-enquiry"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          (click)="closeMenu()"
          >Create Enquiry</a
        >
        @if (isAdmin) {
          <a
            class="nav-link app-navbar__link"
            routerLink="/enquiry"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            (click)="closeMenu()"
            >Enquiries</a
          >
          <a
            class="nav-link app-navbar__link"
            routerLink="/category"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            (click)="closeMenu()"
            >Categories</a
          >
          <a
            class="nav-link app-navbar__link"
            routerLink="/status"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            (click)="closeMenu()"
            >Status</a
          >
          <a
            class="btn app-navbar__login"
            routerLink="/login"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            (click)="closeMenu(); signOut()"
            >Sign out</a
          >
        } @else {
          <a
            class="btn app-navbar__login"
            routerLink="/login"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            (click)="closeMenu()"
            >Sign in</a
          >
        }
      </div>
    </div>
  </div>
</nav>
